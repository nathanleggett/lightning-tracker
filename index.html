<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚡ StrikeLive</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    :root {
      --bg:        #0a0d12;
      --surface:   #111520;
      --surface2:  #161c2d;
      --border:    #1e2a40;
      --bolt:      #4dc9ff;
      --bolt-dim:  #1a5a7a;
      --bolt-glow: rgba(77,201,255,0.18);
      --danger:    #f87171;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --dim:       #2d3f58;
      --mono:      'JetBrains Mono','Fira Code',Consolas,monospace;
      --panel-w:   300px;
      --panel-mob: 230px;
      --r:         6px;
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; font-size:14px; }
    #app { display:flex; width:100%; height:100%; }
    #map-wrap { flex:1; position:relative; }
    #map { width:100%; height:100%; }
    #topbar {
      position:absolute; top:0; left:0; right:0; z-index:1000;
      display:flex; align-items:center; gap:8px; padding:10px 12px;
      background:linear-gradient(to bottom,rgba(10,13,18,.96) 55%,transparent);
      pointer-events:none;
    }
    #topbar > * { pointer-events:auto; }
    .wordmark { font-family:var(--mono); font-size:15px; font-weight:700; color:var(--bolt); letter-spacing:.04em; white-space:nowrap; text-shadow:0 0 18px var(--bolt-glow); }
    .wordmark small { color:var(--muted); font-weight:400; font-size:10px; margin-left:4px; letter-spacing:.08em; }
    .pill { display:flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.06em; border:1px solid var(--border); background:var(--surface); color:var(--muted); white-space:nowrap; transition:.2s; }
    .pill.live    { border-color:#22c55e55; color:#4ade80; background:#0a2a1555; }
    .pill.waiting { border-color:var(--bolt-dim); color:var(--bolt); }
    .pill.error   { border-color:#f8717155; color:var(--danger); }
    .dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0; }
    .pill.live .dot { animation:blink 2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    #rate { font-family:var(--mono); font-size:10px; color:var(--muted); background:var(--surface); border:1px solid var(--border); padding:3px 8px; border-radius:20px; }
    .spacer { flex:1; }
    #filters { position:absolute; top:50px; left:12px; z-index:1000; display:flex; gap:4px; flex-wrap:wrap; }
    .fb { padding:4px 10px; border-radius:20px; border:1px solid var(--border); background:var(--surface); color:var(--muted); font-family:var(--mono); font-size:10px; font-weight:600; cursor:pointer; transition:.2s; letter-spacing:.05em; backdrop-filter:blur(4px); }
    .fb:hover { border-color:var(--bolt-dim); color:var(--text); }
    .fb.on { border-color:var(--bolt); color:var(--bolt); background:var(--bolt-glow); text-shadow:0 0 8px currentColor; }
    #map-btns { position:absolute; bottom:16px; right:12px; z-index:1000; display:flex; flex-direction:column; gap:6px; }
    .mb { width:36px; height:36px; border-radius:var(--r); border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.2s; backdrop-filter:blur(4px); }
    .mb:hover { background:var(--surface2); border-color:var(--bolt-dim); color:var(--bolt); }
    .mb.on { border-color:var(--bolt); color:var(--bolt); background:var(--bolt-glow); }
    #alert-banner { position:absolute; top:92px; left:50%; z-index:2000; transform:translateX(-50%) translateY(-8px); opacity:0; pointer-events:none; transition:opacity .3s,transform .3s; white-space:nowrap; }
    #alert-banner.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .alert-inner { display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:var(--r); background:#1a0a0a; border:1px solid var(--danger); color:var(--danger); font-family:var(--mono); font-size:12px; font-weight:700; box-shadow:0 0 24px rgba(248,113,113,.25); }
    #sidebar { width:var(--panel-w); background:var(--surface); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; z-index:100; }
    .sh { padding:11px 14px; border-bottom:1px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:space-between; }
    .sh-title { font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.12em; color:var(--muted); text-transform:uppercase; }
    #count { font-family:var(--mono); font-size:10px; color:var(--bolt); font-weight:600; }
    #settings { border-bottom:1px solid var(--border); padding:10px 14px; display:flex; flex-direction:column; gap:8px; flex-shrink:0; background:var(--bg); }
    .srow { display:flex; align-items:center; justify-content:space-between; }
    .slabel { font-size:11px; color:var(--muted); }
    select { background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:4px; font-family:var(--mono); font-size:10px; padding:3px 6px; cursor:pointer; outline:none; }
    .toggle { position:relative; display:inline-block; width:30px; height:16px; }
    .toggle input { display:none; }
    .tt { position:absolute; inset:0; background:var(--border); border-radius:8px; cursor:pointer; transition:.2s; }
    .tt::after { content:''; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:var(--muted); transition:.2s; }
    .toggle input:checked + .tt { background:var(--bolt-dim); }
    .toggle input:checked + .tt::after { transform:translateX(14px); background:var(--bolt); }
    #strike-list { flex:1; overflow-y:auto; }
    #strike-list::-webkit-scrollbar { width:3px; }
    #strike-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
    .si { display:flex; align-items:flex-start; gap:10px; padding:9px 14px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .2s; animation:fadeIn .3s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-3px)} to{opacity:1;transform:none} }
    .si:hover { background:var(--surface2); }
    .si.flash { animation:flash .8s ease; }
    @keyframes flash { 0%{background:rgba(77,201,255,.12)} 100%{background:transparent} }
    .si-icon { font-size:13px; flex-shrink:0; line-height:1.7; }
    .si-body { flex:1; min-width:0; }
    .si-top { display:flex; justify-content:space-between; align-items:center; }
    .si-type { font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.07em; }
    .si-dist { font-family:var(--mono); font-size:11px; font-weight:600; color:var(--text); }
    .si-time { font-family:var(--mono); font-size:10px; color:var(--muted); margin-top:2px; }
    .si-meta { font-family:var(--mono); font-size:9px; color:var(--dim); margin-top:2px; }
    .cCG{color:#4dc9ff} .cIC{color:#c084fc} .cCC{color:#fb923c} .cUK{color:var(--muted)}
    .empty { padding:28px 14px; text-align:center; color:var(--dim); font-family:var(--mono); font-size:11px; line-height:1.9; }
    #disclaimer { padding:7px 14px; border-top:1px solid var(--border); font-size:10px; color:var(--dim); line-height:1.5; flex-shrink:0; font-style:italic; }
    .mwrap { position:relative; }
    .mdot { width:8px; height:8px; border-radius:50%; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); }
    .mring { position:absolute; border-radius:50%; border:1.5px solid currentColor; top:50%; left:50%; width:16px; height:16px; transform:translate(-50%,-50%) scale(0); opacity:0; }
    .r1{animation:ripple 2s ease-out infinite}
    .r2{animation:ripple 2s ease-out .55s infinite}
    .r3{animation:ripple 2s ease-out 1.1s infinite}
    @keyframes ripple { 0%{transform:translate(-50%,-50%) scale(.3);opacity:.85} 100%{transform:translate(-50%,-50%) scale(3.8);opacity:0} }
    .leaflet-control-attribution{display:none !important}
    .leaflet-control-zoom{border:1px solid var(--border) !important}
    .leaflet-control-zoom a{background:var(--surface) !important;color:var(--muted) !important;border-color:var(--border) !important}
    .leaflet-control-zoom a:hover{background:var(--surface2) !important;color:var(--bolt) !important}
    @media(max-width:700px){
      #app{flex-direction:column}
      #sidebar{width:100%;height:var(--panel-mob);border-left:none;border-top:1px solid var(--border);flex-shrink:0}
      #map-btns{bottom:calc(var(--panel-mob) + 12px)}
      .wordmark small{display:none}
    }
    @media(min-width:701px){#sidebar{height:100%}}
  </style>
</head>
<body>
<div id="app">
  <div id="map-wrap">
    <div id="map"></div>
    <div id="topbar">
      <div class="wordmark">⚡ STRIKELIVE <small>BLITZORTUNG</small></div>
      <div class="pill waiting" id="conn-pill"><div class="dot"></div><span id="conn-text">CONNECTING</span></div>
      <div id="rate">— /min</div>
      <div class="spacer"></div>
    </div>
    <div id="filters">
      <button class="fb on" data-m="5">5m</button>
      <button class="fb" data-m="30">30m</button>
      <button class="fb" data-m="60">1h</button>
      <button class="fb" data-m="1440">24h</button>
    </div>
    <div id="map-btns">
      <button class="mb" id="btn-locate" title="My location">◎</button>
      <button class="mb" id="btn-sound">🔇</button>
    </div>
    <div id="alert-banner">
      <div class="alert-inner">⚡ <span id="alert-text"></span></div>
    </div>
  </div>
  <div id="sidebar">
    <div class="sh">
      <div class="sh-title">Recent Strikes</div>
      <div id="count">0 visible</div>
    </div>
    <div id="settings">
      <div class="srow">
        <span class="slabel">Alert within</span>
        <select id="alert-radius">
          <option value="0">Off</option>
          <option value="8">5 mi</option>
          <option value="16" selected>10 mi</option>
          <option value="32">20 mi</option>
          <option value="80">50 mi</option>
        </select>
      </div>
      <div class="srow">
        <span class="slabel">Sound alerts</span>
        <label class="toggle"><input type="checkbox" id="snd"><div class="tt"></div></label>
      </div>
    </div>
    <div id="strike-list">
      <div class="empty">Connecting to Blitzortung…<br>Strikes appear in real time.</div>
    </div>
    <div id="disclaimer">⚠ Estimated detection locations only. Not guaranteed exact strike points. Always follow official weather guidance.</div>
  </div>
</div>
<script>
const S = {
  strikes:     new Map(),
  userLat:     null,
  userLon:     null,
  filterMins:  5,
  alertRadius: 16,
  soundOn:     false,
  times:       [],
};
const map = L.map('map', { center:[30,0], zoom:3 });
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom:19, subdomains:'abcd' }).addTo(map);
let ctx = null;
function thunder() {
  try {
    if (!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
    const b = ctx.createBuffer(1, ctx.sampleRate*.45, ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.4);
    const s=ctx.createBufferSource(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    f.type='bandpass'; f.frequency.value=160; f.Q.value=0.6;
    g.gain.setValueAtTime(.55,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.45);
    s.buffer=b; s.connect(f); f.connect(g); g.connect(ctx.destination); s.start();
  } catch(e){}
}
function hav(a,b,c,d){const R=6371,r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function mi(k){return(k*.621371).toFixed(1);}
function ago(t){const s=Math.floor((Date.now()-t)/1000);if(s<10)return'just now';if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';return Math.floor(s/3600)+'h ago';}
function alpha(t){return Math.max(.12,1-(Date.now()-t)/(S.filterMins*60000)*.88);}
function tColor(t){return{CG:'#4dc9ff',IC:'#c084fc',CC:'#fb923c'}[t]||'#64748b';}
function tIcon(t){return{CG:'⚡',IC:'☁',CC:'🌩'}[t]||'✦';}
function tClass(t){return{CG:'cCG',IC:'cIC',CC:'cCC'}[t]||'cUK';}
function mkIcon(type,a){
  const c=tColor(type);
  return L.divIcon({
    html:`<div class="mwrap" style="color:${c};opacity:${a}"><div class="mdot" style="background:${c};box-shadow:0 0 5px ${c}"></div><div class="mring r1"></div><div class="mring r2"></div><div class="mring r3"></div></div>`,
    className:'', iconSize:[32,32], iconAnchor:[16,16]
  });
}
function popup(s){
  const dist=S.userLat!=null?(()=>{const k=hav(S.userLat,S.userLon,s.lat,s.lon);return`${k.toFixed(1)} km / ${mi(k)} mi`;})():'—';
  return `<div style="font-family:monospace;font-size:11px;line-height:1.75;color:#e2e8f0;min-width:150px">
    <b style="font-size:13px;color:${tColor(s.type)}">${tIcon(s.type)} ${s.type||'?'}</b>
    <div style="color:#64748b">${ago(s.time)}</div>
    <hr style="border:none;border-top:1px solid #1e2a40;margin:5px 0">
    <div>Distance: <b>${dist}</b></div>
    <div>Pos: ${s.lat.toFixed(4)}, ${s.lon.toFixed(4)}</div>
    ${s.stations!=null?`<div>Stations: <b>${s.stations}</b></div>`:''}
    <div style="color:#2d3f58;font-size:9px;margin-top:4px">Estimated location only</div>
  </div>`;
}
function add(s, isNew=true){
  if(s.time < Date.now()-S.filterMins*60000) return;
  if(S.strikes.has(s.id)) return;
  const m=L.marker([s.lat,s.lon],{icon:mkIcon(s.type,alpha(s.time))}).addTo(map);
  m.bindPopup(popup(s));
  S.strikes.set(s.id,{...s,marker:m});
  if(isNew){ S.times.push(Date.now()); checkAlert(s); }
}
function prune(){
  const cut=Date.now()-S.filterMins*60000;
  for(const[id,s] of S.strikes){if(s.time<cut){map.removeLayer(s.marker);S.strikes.delete(id);}}
}
function refreshOpacity(){
  for(const[,s] of S.strikes) if(s.marker) s.marker.setIcon(mkIcon(s.type,alpha(s.time)));
}
let alertQ=[], alertBusy=false;
function checkAlert(s){
  if(!S.alertRadius||S.userLat==null) return;
  const d=hav(S.userLat,S.userLon,s.lat,s.lon);
  if(d<=S.alertRadius){ alertQ.push(`Strike ${mi(d)} mi away`); if(S.soundOn) thunder(); flush(); }
}
function flush(){
  if(alertBusy||!alertQ.length) return;
  const banner=document.getElementById('alert-banner');
  document.getElementById('alert-text').textContent=alertQ.shift();
  banner.classList.add('show'); alertBusy=true;
  clearTimeout(banner._t);
  banner._t=setTimeout(()=>{banner.classList.remove('show');alertBusy=false;setTimeout(flush,400);},4000);
}
let rPending=false;
function render(){
  if(rPending) return; rPending=true;
  requestAnimationFrame(()=>{
    rPending=false;
    const list=document.getElementById('strike-list');
    const sorted=[...S.strikes.values()].sort((a,b)=>b.time-a.time);
    document.getElementById('count').textContent=sorted.length+' visible';
    if(!sorted.length){list.innerHTML=`<div class="empty">No strikes in last ${S.filterMins<60?S.filterMins+'m':S.filterMins/60+'h'}.<br>Zoom out or widen filter.</div>`;return;}
    list.innerHTML=sorted.slice(0,300).map(s=>{
      const dist=S.userLat!=null?mi(hav(S.userLat,S.userLon,s.lat,s.lon))+' mi':'— mi';
      return `<div class="si" data-id="${s.id}">
        <div class="si-icon ${tClass(s.type)}">${tIcon(s.type)}</div>
        <div class="si-body">
          <div class="si-top"><span class="si-type ${tClass(s.type)}">${s.type||'?'}</span><span class="si-dist">${dist}</span></div>
          <div class="si-time">${ago(s.time)}</div>
          ${s.stations!=null?`<div class="si-meta">${s.stations} stations</div>`:''}
        </div></div>`;
    }).join('');
    list.querySelectorAll('.si').forEach(el=>el.addEventListener('click',()=>{
      const s=S.strikes.get(el.dataset.id);
      if(!s) return;
      map.flyTo([s.lat,s.lon],Math.max(map.getZoom(),8),{duration:.8});
      setTimeout(()=>s.marker?.openPopup(),900);
    }));
  });
}
function setConn(cls,txt){
  const p=document.getElementById('conn-pill'),t=document.getElementById('conn-text');
  p.className='pill '+cls; t.textContent=txt;
}
let es=null, reconn=null;
function connectSSE(){
  if(es){try{es.close();}catch(e){}}
  setConn('waiting','CONNECTING…');
  es=new EventSource('/api/stream');
  es.onmessage=e=>{
    try{
      const msg=JSON.parse(e.data);
      if(msg.type==='status'){setConn(msg.connected?'live':'waiting',msg.connected?'LIVE':'BUFFERING…');return;}
      if(msg.type==='history'){for(const s of msg.strikes)add(s,false);prune();render();return;}
      add(msg,true);render();
    }catch(e){}
  };
  es.onerror=()=>{
    setConn('error','RECONNECTING…');
    es.close();
    clearTimeout(reconn);
    reconn=setTimeout(connectSSE,5000);
  };
}
let uMarker=null;
function locate(pan=true){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p=>{
    S.userLat=p.coords.latitude; S.userLon=p.coords.longitude;
    if(pan) map.flyTo([S.userLat,S.userLon],9,{duration:1.2});
    const ic=L.divIcon({html:`<div style="width:14px;height:14px;border-radius:50%;background:#4ade80;border:2px solid #fff;box-shadow:0 0 0 4px rgba(74,222,128,.25)"></div>`,className:'',iconSize:[14,14],iconAnchor:[7,7]});
    if(uMarker) map.removeLayer(uMarker);
    uMarker=L.marker([S.userLat,S.userLon],{icon:ic,zIndexOffset:1000}).addTo(map);
    render();
  },e=>console.warn(e.message));
}
setInterval(()=>{prune();refreshOpacity();render();},10000);
setInterval(()=>{
  const now=Date.now(); S.times=S.times.filter(t=>now-t<60000);
  document.getElementById('rate').textContent=S.times.length+' /min';
},5000);
document.querySelectorAll('.fb').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.fb').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); S.filterMins=parseInt(b.dataset.m);
  prune(); render();
}));
document.getElementById('btn-locate').addEventListener('click',()=>locate(true));
document.getElementById('btn-sound').addEventListener('click',function(){
  S.soundOn=!S.soundOn; this.textContent=S.soundOn?'🔔':'🔇'; this.classList.toggle('on',S.soundOn);
  if(S.soundOn){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();}catch(e){}}
});
document.getElementById('snd').addEventListener('change',function(){
  S.soundOn=this.checked;
  const b=document.getElementById('btn-sound'); b.textContent=S.soundOn?'🔔':'🔇'; b.classList.toggle('on',S.soundOn);
  if(S.soundOn){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();}catch(e){}}
});
document.getElementById('alert-radius').addEventListener('change',e=>S.alertRadius=parseInt(e.target.value));
locate(false);
connectSSE();
</script>
</body>
</html>
