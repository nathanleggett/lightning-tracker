<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚡ StrikeLive</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    /* ── Design tokens ─────────────────────────────────────────── */
    :root {
      --bg:           #0a0d12;
      --surface:      #111520;
      --surface2:     #161c2d;
      --border:       #1e2a40;
      --bolt:         #4dc9ff;
      --bolt-dim:     #1a5a7a;
      --bolt-glow:    rgba(77,201,255,0.25);
      --strike-cg:    #4dc9ff;
      --strike-ic:    #c084fc;
      --strike-cc:    #fb923c;
      --strike-old:   #334155;
      --warn:         #fbbf24;
      --danger:       #f87171;
      --text:         #e2e8f0;
      --text-muted:   #64748b;
      --text-dim:     #334155;
      --mono:         'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      --sans:         'Inter', system-ui, sans-serif;
      --panel-w:      320px;
      --panel-h-mob:  220px;
      --radius:       6px;
      --transition:   0.2s ease;
    }

    /* ── Reset & base ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }

    /* ── Layout ────────────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: row;
      width: 100%; height: 100%;
      position: relative;
    }

    #map-container {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    #map {
      width: 100%; height: 100%;
    }

    /* ── Top bar ───────────────────────────────────────────────── */
    #topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: linear-gradient(to bottom, rgba(10,13,18,0.95) 60%, transparent);
      pointer-events: none;
    }

    #topbar > * { pointer-events: auto; }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 700;
      color: var(--bolt);
      letter-spacing: 0.04em;
      white-space: nowrap;
      text-shadow: 0 0 16px var(--bolt-glow);
    }
    .wordmark span { color: var(--text-muted); font-weight: 400; font-size: 11px; letter-spacing: 0.08em; }

    #status-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 20px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      white-space: nowrap;
    }
    #status-pill.live { border-color: #22c55e55; color: #4ade80; background: #052e1655; }
    #status-pill.updating { border-color: var(--bolt-dim); color: var(--bolt); }
    #status-pill.error { border-color: #f8717155; color: var(--danger); }
    .pulse-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    .live .pulse-dot { animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    #demo-badge {
      display: none;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      background: #7c3aed22;
      border: 1px solid #7c3aed55;
      color: #a78bfa;
      font-family: var(--mono);
    }
    #demo-badge.visible { display: block; }

    .spacer { flex: 1; }

    /* ── Map controls ──────────────────────────────────────────── */
    #map-controls {
      position: absolute;
      bottom: 16px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .map-btn {
      width: 36px; height: 36px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition);
      backdrop-filter: blur(4px);
    }
    .map-btn:hover { background: var(--surface2); border-color: var(--bolt-dim); color: var(--bolt); }
    .map-btn:active { transform: scale(0.95); }
    .map-btn.active { border-color: var(--bolt); color: var(--bolt); background: var(--bolt-glow); }

    /* ── Filter bar ────────────────────────────────────────────── */
    #filter-bar {
      position: absolute;
      top: 52px;
      left: 12px;
      z-index: 1000;
      display: flex;
      gap: 4px;
    }

    .filter-btn {
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      letter-spacing: 0.05em;
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }
    .filter-btn:hover { border-color: var(--bolt-dim); color: var(--text); }
    .filter-btn.active {
      border-color: var(--bolt);
      color: var(--bolt);
      background: var(--bolt-glow);
      text-shadow: 0 0 8px currentColor;
    }

    /* ── Alert banner ──────────────────────────────────────────── */
    #alert-banner {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      white-space: nowrap;
    }
    #alert-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .alert-inner {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: var(--radius);
      background: #1a0a0a;
      border: 1px solid var(--danger);
      color: var(--danger);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      box-shadow: 0 0 20px rgba(248,113,113,0.3);
    }

    /* ── Sidebar ───────────────────────────────────────────────── */
    #sidebar {
      width: var(--panel-w);
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 100;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .sidebar-title {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    #strike-count {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--bolt);
      font-weight: 600;
    }

    /* Settings panel */
    #settings-panel {
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      background: var(--bg);
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .setting-label {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .setting-control {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    select, .seg-control {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 10px;
      padding: 3px 6px;
      cursor: pointer;
      outline: none;
    }
    select:focus { border-color: var(--bolt-dim); }

    .seg-control {
      display: flex;
      gap: 2px;
      padding: 2px;
    }
    .seg-btn {
      padding: 2px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 10px;
      font-family: var(--mono);
      color: var(--text-muted);
      background: transparent;
      border: none;
      transition: var(--transition);
    }
    .seg-btn.active { background: var(--bolt-dim); color: var(--bolt); }

    /* Toggle switch */
    .toggle { position: relative; display: inline-block; width: 30px; height: 16px; }
    .toggle input { display: none; }
    .toggle-track {
      position: absolute; inset: 0;
      background: var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: var(--transition);
    }
    .toggle input:checked + .toggle-track { background: var(--bolt-dim); }
    .toggle input:checked + .toggle-track::after { transform: translateX(14px); background: var(--bolt); }

    /* Strike list */
    #strike-list {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    #strike-list::-webkit-scrollbar { width: 4px; }
    #strike-list::-webkit-scrollbar-track { background: transparent; }
    #strike-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .strike-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background var(--transition);
      animation: slideIn 0.25s ease;
    }
    @keyframes slideIn { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform: none; } }
    .strike-item:hover { background: var(--surface2); }
    .strike-item.new-flash { animation: newFlash 0.6s ease; }
    @keyframes newFlash { 0% { background: rgba(77,201,255,0.15); } 100% { background: transparent; } }

    .strike-icon {
      font-size: 14px;
      flex-shrink: 0;
      line-height: 1.6;
      filter: drop-shadow(0 0 4px currentColor);
    }
    .type-CG .strike-icon { color: var(--strike-cg); }
    .type-IC .strike-icon { color: var(--strike-ic); }
    .type-CC .strike-icon { color: var(--strike-cc); }
    .type-unknown .strike-icon { color: var(--text-muted); }

    .strike-info { flex: 1; min-width: 0; }
    .strike-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }
    .strike-type {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .type-CG .strike-type { color: var(--strike-cg); }
    .type-IC .strike-type { color: var(--strike-ic); }
    .type-CC .strike-type { color: var(--strike-cc); }
    .type-unknown .strike-type { color: var(--text-muted); }

    .strike-dist {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text);
      font-weight: 600;
    }
    .strike-time {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .strike-meta {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-dim);
      margin-top: 2px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .meta-item { color: var(--text-dim); }
    .meta-item span { color: var(--text-muted); }

    .empty-state {
      padding: 32px 14px;
      text-align: center;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.8;
    }

    /* Disclaimer */
    #disclaimer {
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--text-dim);
      line-height: 1.5;
      flex-shrink: 0;
      font-style: italic;
    }

    /* ── Leaflet overrides ─────────────────────────────────────── */
    .leaflet-control-attribution { display: none !important; }
    .leaflet-control-zoom {
      border: 1px solid var(--border) !important;
      background: var(--surface) !important;
    }
    .leaflet-control-zoom a {
      background: var(--surface) !important;
      color: var(--text-muted) !important;
      border-color: var(--border) !important;
      font-size: 16px !important;
      line-height: 26px !important;
    }
    .leaflet-control-zoom a:hover {
      background: var(--surface2) !important;
      color: var(--bolt) !important;
    }

    /* ── Strike pulse markers ──────────────────────────────────── */
    .strike-marker-wrap { position: relative; }
    .strike-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid currentColor;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
    }
    .ring-1 { animation: ripple 2s ease-out infinite; }
    .ring-2 { animation: ripple 2s ease-out 0.5s infinite; }
    .ring-3 { animation: ripple 2s ease-out 1s infinite; }
    @keyframes ripple {
      0%   { transform: translate(-50%,-50%) scale(0.3); opacity: 0.8; width: 16px; height: 16px; }
      100% { transform: translate(-50%,-50%) scale(3.5); opacity: 0; width: 16px; height: 16px; }
    }

    /* ── Mobile bottom panel ───────────────────────────────────── */
    @media (max-width: 700px) {
      #app { flex-direction: column; }
      #sidebar {
        width: 100%;
        height: var(--panel-h-mob);
        border-left: none;
        border-top: 1px solid var(--border);
        flex-shrink: 0;
      }
      #map-controls { bottom: calc(var(--panel-h-mob) + 12px); }
      .wordmark span { display: none; }
      #filter-bar { flex-wrap: wrap; }
    }

    /* ── Panel toggle (mobile) ─────────────────────────────────── */
    #panel-toggle {
      display: none;
      position: absolute;
      bottom: calc(var(--panel-h-mob) - 1px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      width: 40px; height: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: var(--radius) var(--radius) 0 0;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: var(--text-muted);
    }
    @media (min-width: 701px) { #panel-toggle { display: none !important; } }

    /* Scrollbar for sidebar on desktop */
    @media (min-width: 701px) {
      #sidebar { height: 100%; }
    }
  </style>
</head>
<body>
<div id="app">
  <!-- Map -->
  <div id="map-container">
    <div id="map"></div>

    <!-- Top bar -->
    <div id="topbar">
      <div class="wordmark">⚡ STRIKELIVE <span>DETECTED LOCATIONS</span></div>
      <div id="status-pill">
        <div class="pulse-dot"></div>
        <span id="status-text">CONNECTING</span>
      </div>
      <div id="demo-badge">DEMO</div>
      <div class="spacer"></div>
    </div>

    <!-- Filter bar -->
    <div id="filter-bar">
      <button class="filter-btn active" data-minutes="5">5m</button>
      <button class="filter-btn" data-minutes="30">30m</button>
      <button class="filter-btn" data-minutes="60">1h</button>
      <button class="filter-btn" data-minutes="1440">24h</button>
    </div>

    <!-- Map controls -->
    <div id="map-controls">
      <button class="map-btn" id="btn-locate" title="Centre on my location">◎</button>
      <button class="map-btn" id="btn-sound" title="Toggle sound alerts" data-on="false">🔇</button>
    </div>

    <!-- Alert banner -->
    <div id="alert-banner">
      <div class="alert-inner">
        <span>⚡</span>
        <span id="alert-text">Lightning detected nearby!</span>
      </div>
    </div>
  </div>

  <!-- Sidebar / bottom panel -->
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Recent Strikes</div>
      <div id="strike-count">0 visible</div>
    </div>

    <div id="settings-panel">
      <div class="setting-row">
        <span class="setting-label">Alert radius</span>
        <div class="setting-control">
          <select id="alert-radius">
            <option value="0">Off</option>
            <option value="8">5 mi</option>
            <option value="16" selected>10 mi</option>
            <option value="32">20 mi</option>
            <option value="80">50 mi</option>
          </select>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Refresh</span>
        <div class="setting-control">
          <div class="seg-control">
            <button class="seg-btn active" data-secs="30">30s</button>
            <button class="seg-btn" data-secs="60">60s</button>
          </div>
        </div>
      </div>
    </div>

    <div id="strike-list">
      <div class="empty-state">Waiting for data…<br>First fetch in progress.</div>
    </div>

    <div id="disclaimer">
      ⚠ Strike positions are estimated detections, not guaranteed exact locations. Always follow official severe weather guidance.
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
// StrikeLive — frontend
// ════════════════════════════════════════════════════════════

const API = '/api/strikes';
const state = {
  strikes:      new Map(),   // id → strike obj with marker
  userLat:      null,
  userLon:      null,
  filterMinutes: 5,
  refreshSecs:  30,
  alertRadius:  16,          // km  (0 = off)
  soundOn:      false,
  refreshTimer: null,
  lastFetch:    null,
  isDemo:       false,
};

// ── Map init ─────────────────────────────────────────────────
const map = L.map('map', {
  center: [30, 0],
  zoom: 3,
  zoomControl: true,
  preferCanvas: false,
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 19,
  subdomains: 'abcd',
}).addTo(map);

// ── Audio context (lazy) ──────────────────────────────────────
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playThunder() {
  try {
    const ctx  = getAudio();
    const buf  = ctx.createBuffer(1, ctx.sampleRate * 0.4, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 1.5);
    }
    const src  = ctx.createBufferSource();
    const gain = ctx.createGain();
    const bpf  = ctx.createBiquadFilter();
    bpf.type = 'bandpass';
    bpf.frequency.value = 180;
    bpf.Q.value = 0.5;
    gain.gain.setValueAtTime(0.6, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    src.buffer = buf;
    src.connect(bpf);
    bpf.connect(gain);
    gain.connect(ctx.destination);
    src.start();
  } catch(e) { /* silent fail */ }
}

// ── Helpers ───────────────────────────────────────────────────
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const d2r = Math.PI / 180;
  const dLat = (lat2 - lat1) * d2r;
  const dLon = (lon2 - lon1) * d2r;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*d2r) * Math.cos(lat2*d2r) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function kmToMi(km) { return (km * 0.621371).toFixed(1); }

function relativeTime(ts) {
  const secs = Math.floor((Date.now() - ts) / 1000);
  if (secs < 10)  return 'just now';
  if (secs < 60)  return `${secs}s ago`;
  if (secs < 3600) return `${Math.floor(secs/60)}m ago`;
  return `${Math.floor(secs/3600)}h ago`;
}

function ageRatio(ts, maxMs) {
  return Math.min(1, (Date.now() - ts) / maxMs);
}

function typeLabel(type) {
  const m = { CG: 'Cloud→Ground', IC: 'Intra-Cloud', CC: 'Cloud↔Cloud', unknown: 'Unknown' };
  return m[type] || type;
}

function typeIcon(type) {
  const m = { CG: '⚡', IC: '☁️', CC: '🌩', unknown: '✦' };
  return m[type] || '⚡';
}

// ── Map bounds for API query ──────────────────────────────────
function getMapBbox() {
  const b = map.getBounds();
  return {
    north: b.getNorth().toFixed(4),
    south: b.getSouth().toFixed(4),
    east:  b.getEast().toFixed(4),
    west:  b.getWest().toFixed(4),
  };
}

// ── Strike marker factory ─────────────────────────────────────
function makeMarkerHtml(type, alpha) {
  const colors = { CG: '#4dc9ff', IC: '#c084fc', CC: '#fb923c', unknown: '#64748b' };
  const c = colors[type] || colors.unknown;

  // Alpha fades from 1 (new) → 0.15 (old)
  const a = Math.max(0.15, 1 - alpha * 0.85);

  return `
    <div class="strike-marker-wrap" style="color:${c};opacity:${a}">
      <div class="strike-dot" style="background:${c};box-shadow:0 0 6px ${c}"></div>
      <div class="ring ring-1" style="border-color:${c}"></div>
      <div class="ring ring-2" style="border-color:${c}"></div>
      <div class="ring ring-3" style="border-color:${c}"></div>
    </div>`;
}

function createMarker(strike) {
  const alpha = ageRatio(strike.time, state.filterMinutes * 60000);
  const icon  = L.divIcon({
    html:        makeMarkerHtml(strike.type, alpha),
    className:   '',
    iconSize:    [32, 32],
    iconAnchor:  [16, 16],
  });

  const marker = L.marker([strike.lat, strike.lon], { icon }).addTo(map);
  marker.bindPopup(makePopupHtml(strike));
  return marker;
}

function makePopupHtml(s) {
  const dist = (state.userLat !== null)
    ? `${haversineKm(state.userLat, state.userLon, s.lat, s.lon).toFixed(1)} km (${kmToMi(haversineKm(state.userLat, state.userLon, s.lat, s.lon))} mi)`
    : '—';
  return `
    <div style="font-family:var(--mono);font-size:11px;line-height:1.7;color:#e2e8f0;min-width:160px">
      <div style="font-weight:700;font-size:13px;color:${typeColor(s.type)}">${typeIcon(s.type)} ${typeLabel(s.type)}</div>
      <div style="color:#64748b;margin-top:2px">Detected ${relativeTime(s.time)}</div>
      <hr style="border:none;border-top:1px solid #1e2a40;margin:5px 0">
      <div>Distance: <b>${dist}</b></div>
      <div>Position: ${s.lat.toFixed(4)}, ${s.lon.toFixed(4)}</div>
      ${s.amplitude !== null ? `<div>Amplitude: <b>${s.amplitude} kA</b></div>` : ''}
      ${s.error !== null ? `<div>Loc. error: <b>±${s.error} km</b></div>` : ''}
      ${s.stations !== null ? `<div>Stations: <b>${s.stations}</b></div>` : ''}
      <div style="color:#334155;font-size:9px;margin-top:5px">Estimated detection only</div>
    </div>`;
}

function typeColor(type) {
  const m = { CG: '#4dc9ff', IC: '#c084fc', CC: '#fb923c', unknown: '#64748b' };
  return m[type] || m.unknown;
}

// ── Fetch & update ────────────────────────────────────────────
function setStatus(state_, text) {
  const pill = document.getElementById('status-pill');
  const span = document.getElementById('status-text');
  pill.className = 'status-pill ' + state_;
  span.textContent = text;
}

async function fetchStrikes() {
  setStatus('updating', 'UPDATING…');
  const bbox = getMapBbox();
  try {
    const qs  = new URLSearchParams(bbox).toString();
    const res = await fetch(`${API}?${qs}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    state.isDemo = data.demo;
    document.getElementById('demo-badge').classList.toggle('visible', !!data.demo);

    processStrikes(data.strikes || []);
    state.lastFetch = Date.now();
    setStatus('live', `LIVE · ${data.count} total`);
  } catch(err) {
    setStatus('error', 'ERROR');
    console.error('Fetch error:', err);
  }
}

function processStrikes(incoming) {
  const cutoff   = Date.now() - state.filterMinutes * 60 * 1000;
  const newOnes  = [];

  for (const s of incoming) {
    if (s.time < cutoff) continue;
    const existing = state.strikes.get(s.id);
    if (!existing) {
      // New strike
      const marker = createMarker(s);
      state.strikes.set(s.id, { ...s, marker });
      newOnes.push(s);
    }
    // else already tracked, update age opacity via refresh cycle
  }

  // Prune expired strikes
  for (const [id, s] of state.strikes) {
    if (s.time < cutoff) {
      if (s.marker) map.removeLayer(s.marker);
      state.strikes.delete(id);
    }
  }

  // Refresh existing marker opacities
  for (const [, s] of state.strikes) {
    if (!s.marker) continue;
    const alpha = ageRatio(s.time, state.filterMinutes * 60000);
    s.marker.setIcon(L.divIcon({
      html:      makeMarkerHtml(s.type, alpha),
      className: '',
      iconSize:  [32, 32],
      iconAnchor:[16, 16],
    }));
  }

  // Sound / distance alert for new strikes
  if (newOnes.length > 0) {
    checkAlerts(newOnes);
  }

  renderList();
}

function checkAlerts(newStrikes) {
  if (state.alertRadius === 0 || state.userLat === null) return;
  const nearby = newStrikes.filter(s =>
    haversineKm(state.userLat, state.userLon, s.lat, s.lon) <= state.alertRadius
  );
  if (nearby.length === 0) return;

  // Closest
  nearby.sort((a, b) =>
    haversineKm(state.userLat, state.userLon, a.lat, a.lon) -
    haversineKm(state.userLat, state.userLon, b.lat, b.lon)
  );
  const d   = haversineKm(state.userLat, state.userLon, nearby[0].lat, nearby[0].lon);
  const mi  = kmToMi(d);
  showAlert(`${nearby.length} strike${nearby.length > 1 ? 's' : ''} within ${mi} mi (${d.toFixed(1)} km)`);
  if (state.soundOn) playThunder();
}

function showAlert(msg) {
  const banner = document.getElementById('alert-banner');
  document.getElementById('alert-text').textContent = msg;
  banner.classList.add('show');
  clearTimeout(banner._t);
  banner._t = setTimeout(() => banner.classList.remove('show'), 5000);
}

// ── Strike list ───────────────────────────────────────────────
function renderList() {
  const list  = document.getElementById('strike-list');
  const count = document.getElementById('strike-count');

  const sorted = [...state.strikes.values()].sort((a, b) => b.time - a.time);
  count.textContent = `${sorted.length} visible`;

  if (sorted.length === 0) {
    list.innerHTML = `<div class="empty-state">No strikes in this window.<br>Try a longer time filter or zoom out.</div>`;
    return;
  }

  list.innerHTML = sorted.slice(0, 200).map(s => {
    const dist = state.userLat !== null
      ? (() => {
          const km = haversineKm(state.userLat, state.userLon, s.lat, s.lon);
          return `${kmToMi(km)} mi`;
        })()
      : '— mi';
    const meta = [
      s.amplitude !== null ? `${s.amplitude > 0 ? '+' : ''}${s.amplitude} kA` : null,
      s.error !== null ? `±${s.error}km` : null,
      s.stations !== null ? `${s.stations} stn` : null,
    ].filter(Boolean);

    return `
      <div class="strike-item type-${s.type}" data-id="${s.id}">
        <div class="strike-icon">${typeIcon(s.type)}</div>
        <div class="strike-info">
          <div class="strike-main">
            <span class="strike-type">${s.type || '???'}</span>
            <span class="strike-dist">${dist}</span>
          </div>
          <div class="strike-time">${relativeTime(s.time)}</div>
          ${meta.length > 0 ? `<div class="strike-meta">${meta.map(m => `<span class="meta-item">${m}</span>`).join('')}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  // Click → pan to strike
  list.querySelectorAll('.strike-item').forEach(el => {
    el.addEventListener('click', () => {
      const s = state.strikes.get(el.dataset.id);
      if (!s) return;
      map.flyTo([s.lat, s.lon], Math.max(map.getZoom(), 9), { duration: 0.8 });
      setTimeout(() => s.marker?.openPopup(), 900);
    });
  });
}

// ── Refresh scheduler ─────────────────────────────────────────
function scheduleRefresh() {
  clearInterval(state.refreshTimer);
  state.refreshTimer = setInterval(fetchStrikes, state.refreshSecs * 1000);
}

// ── Geolocation ───────────────────────────────────────────────
function locateUser(pan = true) {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    state.userLat = pos.coords.latitude;
    state.userLon = pos.coords.longitude;
    if (pan) map.flyTo([state.userLat, state.userLon], 9, { duration: 1.2 });
    updateUserMarker();
  }, err => console.warn('Geolocation:', err.message));
}

let userMarker = null;
function updateUserMarker() {
  const icon = L.divIcon({
    html: `<div style="width:14px;height:14px;border-radius:50%;background:#4ade80;border:2px solid #fff;box-shadow:0 0 0 4px rgba(74,222,128,0.25)"></div>`,
    className: '',
    iconSize: [14, 14],
    iconAnchor: [7, 7],
  });
  if (userMarker) map.removeLayer(userMarker);
  userMarker = L.marker([state.userLat, state.userLon], { icon, zIndexOffset: 1000 }).addTo(map);
  userMarker.bindPopup('<span style="font-family:var(--mono);font-size:11px">📍 Your location</span>');
}

// ── Event wiring ──────────────────────────────────────────────

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.filterMinutes = parseInt(btn.dataset.minutes);
    // Prune and refresh immediately
    const cutoff = Date.now() - state.filterMinutes * 60 * 1000;
    for (const [id, s] of state.strikes) {
      if (s.time < cutoff) { map.removeLayer(s.marker); state.strikes.delete(id); }
    }
    renderList();
    fetchStrikes();
  });
});

// Refresh rate segmented control
document.querySelectorAll('.seg-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.refreshSecs = parseInt(btn.dataset.secs);
    scheduleRefresh();
  });
});

// Alert radius
document.getElementById('alert-radius').addEventListener('change', e => {
  state.alertRadius = parseInt(e.target.value);
});

// Locate button
document.getElementById('btn-locate').addEventListener('click', () => locateUser(true));

// Sound toggle
document.getElementById('btn-sound').addEventListener('click', function() {
  state.soundOn = !state.soundOn;
  this.textContent = state.soundOn ? '🔔' : '🔇';
  this.classList.toggle('active', state.soundOn);
  if (state.soundOn) {
    // Unlock audio context on user gesture
    try { getAudio().resume(); } catch(e) {}
  }
});

// Refresh on map move (re-query with new bbox)
map.on('moveend', () => {
  if (state.lastFetch && Date.now() - state.lastFetch > 5000) {
    fetchStrikes();
  }
});

// Refresh time labels periodically
setInterval(() => {
  if (state.strikes.size > 0) renderList();
}, 15000);

// ── Boot ──────────────────────────────────────────────────────
(async function init() {
  // Check provider info
  try {
    const r = await fetch('/api/provider');
    const d = await r.json();
    state.isDemo = d.demo;
    document.getElementById('demo-badge').classList.toggle('visible', !!d.demo);
  } catch(e) {}

  // Try to geolocate silently on load
  locateUser(false);

  // First fetch
  await fetchStrikes();
  scheduleRefresh();
})();
</script>
</body>
</html>
